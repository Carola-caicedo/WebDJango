{% extends 'loginRegister/base.html' %}

{% block title %}Restablecer contraseña{% endblock %}

{% block content %}
<h1>Nueva contraseña</h1>

<form method="post" novalidate>
    {% csrf_token %}

    <label for="id_password">Nueva contraseña</label>
    <input type="password" name="password" id="id_password">
    {{ form.password.errors }}

    <label for="id_password2">Confirmar contraseña</label>
    <input type="password" name="password2" id="id_password2">
    {{ form.password2.errors }}

    <button type="submit">Guardar nueva contraseña</button>
</form>

<p class="link"><a href="{% url 'login' %}">Volver al login</a></p>
{% endblock %}
