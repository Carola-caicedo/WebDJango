{% extends 'loginRegister/base.html' %}

{% block title %}Inicio{% endblock %}

{% block content %}
<h1>Bienvenido a la página privada de inicio</h1>
<p style="text-align: center; color: #555;">
    Has iniciado sesión como: <strong>{{ request.user.first_name|default:request.user.email }}</strong>
</p>

<form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Cerrar sesión</button>
</form>
{% endblock %}
