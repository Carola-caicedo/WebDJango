{% extends 'loginRegister/base.html' %}

{% block title %}Recuperar contraseña{% endblock %}

{% block content %}
<h1>Recuperar contraseña</h1>

<form method="post" novalidate>
    {% csrf_token %}

    <label for="id_email">Correo electrónico</label>
    <input type="email" name="email" id="id_email" value="{{ form.email.value|default:'' }}">
    {{ form.email.errors }}

    <button type="submit">Enviar enlace</button>
</form>

<p class="link">¿Recordaste tu contraseña? <a href="{% url 'login' %}">Inicia sesión</a></p>
{% endblock %}
